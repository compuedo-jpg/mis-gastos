<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Gastos · Visual AI Lab</title>
<meta name="description" content="Control de gastos personales por Visual AI Lab">
<meta name="theme-color" content="#0B2B27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F4F8F6; --ink:#10201D; --ink-2:#4A5D59; --ink-3:#768985; --line:#DCE5E2;
  --brand:#0B6B5F; --brand-soft:#DDEFEA; --on-brand:#FFFFFF;
  --hero:#0B2B27; --hero-2:#134540; --on-hero:#F2FAF8; --on-hero-2:#A7C8C1; --hero-line:rgba(255,255,255,.12);
  --accent:#E3A63B;
  --good:#1B8A5E; --good-soft:#DCF1E6; --bad:#C43D3D; --bad-soft:#FBE4E2; --warn:#A8660A; --warn-soft:#FBEED6;
  --shadow:0 1px 2px rgba(11,43,39,.05),0 6px 20px rgba(11,43,39,.06);
  --r:18px;
  --font-d:"Sora",-apple-system,"SF Pro Display",system-ui,sans-serif;
  --font-b:"Figtree",-apple-system,"SF Pro Text",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071210; --surface:#0E1C1A; --surface-2:#132421; --ink:#E6F0ED; --ink-2:#A5B8B3; --ink-3:#6E817C; --line:#1E302C;
    --brand:#3DBAA6; --brand-soft:#11332E; --on-brand:#04201B;
    --hero:#0A221F; --hero-2:#103631;
    --good:#45C58F; --good-soft:#10302A; --bad:#EF7474; --bad-soft:#381B1B; --warn:#EDAA4C; --warn-soft:#342711;
    --shadow:0 1px 0 rgba(255,255,255,.03);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071210; --surface:#0E1C1A; --surface-2:#132421; --ink:#E6F0ED; --ink-2:#A5B8B3; --ink-3:#6E817C; --line:#1E302C;
  --brand:#3DBAA6; --brand-soft:#11332E; --on-brand:#04201B;
  --hero:#0A221F; --hero-2:#103631;
  --good:#45C58F; --good-soft:#10302A; --bad:#EF7474; --bad-soft:#381B1B; --warn:#EDAA4C; --warn-soft:#342711;
  --shadow:0 1px 0 rgba(255,255,255,.03);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--hero)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex:none}

/* ---------- Header (banda de marca) ---------- */
.hero{background:linear-gradient(170deg,var(--hero-2),var(--hero) 70%);color:var(--on-hero);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(227,166,59,.22),transparent 65%);pointer-events:none}
.hero-in{max-width:560px;margin:0 auto;position:relative;z-index:1;display:flex;flex-direction:column;gap:14px}
.brandbar{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-hero-2)}
.icon-btn{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:var(--on-hero)}
.icon-btn:active{background:rgba(255,255,255,.16)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.htitle{font-family:var(--font-d);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hsub{color:var(--on-hero-2);font-size:14px;margin:2px 0 0}
.month{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.month button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--on-hero)}
.month button:active{background:rgba(255,255,255,.14)}
.month span{font-weight:600;font-size:14px;min-width:112px;text-align:center}
.bal-label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-hero-2)}
.bal{font-family:var(--font-d);font-weight:700;font-size:clamp(34px,10vw,44px);letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split>div{background:rgba(255,255,255,.07);border:1px solid var(--hero-line);border-radius:14px;padding:10px 12px}
.split .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--on-hero-2)}
.split .k .ic{width:16px;height:16px}
.split .v{font-family:var(--font-d);font-weight:600;font-size:18px;margin-top:2px}
.dot-in{color:#7FE0B5}.dot-out{color:#FFB1A6}

/* ---------- Contenido ---------- */
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-family:var(--font-d);font-size:17px;font-weight:600;margin:0;min-width:0}
.link{color:var(--brand);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--brand-soft);border-radius:var(--r);padding:14px 16px;color:var(--ink)}
.banner .ic{color:var(--brand);margin-top:2px}
.banner p{margin:0;font-size:14px}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-s{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-d{background:var(--bad-soft);color:var(--bad)}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn:active{transform:scale(.98)}

/* progreso */
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s ease}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

.budget-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.budget-top .big{font-family:var(--font-d);font-weight:600;font-size:22px}
.budget-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.ins .ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.ins .ib .ic{width:18px;height:18px}
.ib.info{background:var(--brand-soft);color:var(--brand)}
.ib.good{background:var(--good-soft);color:var(--good)}
.ib.warn{background:var(--warn-soft);color:var(--warn)}
.ib.bad{background:var(--bad-soft);color:var(--bad)}
.ins b{font-weight:700}

/* categorías */
.cat-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.cat-ic .ic{width:20px;height:20px}
.catrows{display:flex;flex-direction:column;gap:14px}
.catrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.catrow .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:6px}
.catrow .top b{font-weight:600}
.catrow .bar{height:8px}
.catrow .bar>i{background:var(--c)}
.catrow .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:4px;gap:8px}

/* movimientos */
.txlist{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;text-align:left;width:100%;border-radius:0}
.tx+.tx{border-top:1px solid var(--line)}
.tx:active{background:var(--surface-2)}
.tx-main{display:flex;flex-direction:column;min-width:0}
.tx-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-family:var(--font-d);font-weight:600;font-size:15px;white-space:nowrap}
.tx-amt.pos{color:var(--good)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 6px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:capitalize}
.daygrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;box-shadow:var(--shadow)}
.daywrap{display:flex;flex-direction:column;gap:6px}
.movs-list{display:flex;flex-direction:column;gap:16px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-width:0}
.search .ic{color:var(--ink-3);width:20px;height:20px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.totals-row{display:flex;gap:10px;flex-wrap:wrap}
.totals-row .pill{font-size:13px;padding:5px 10px}

.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty .ic{width:36px;height:36px;color:var(--ink-3);margin-bottom:6px}
.empty h3{font-family:var(--font-d);font-size:17px;margin:0 0 4px;color:var(--ink)}
.empty p{margin:0 0 14px;font-size:14px}

/* análisis */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:150px;height:150px}
.donut .t1{font-family:var(--font-d);font-weight:700;fill:var(--ink)}
.donut .t2{fill:var(--ink-3);font-size:11px}
.legend{display:flex;flex-direction:column;gap:8px;width:100%}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:14px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .tl{fill:var(--ink-3);font-size:10px;font-family:var(--font-b)}
.chart .ml{fill:var(--ink-2);font-size:11px;font-family:var(--font-b);font-weight:600}
.chart .cur{fill:var(--ink);font-weight:700}
.lg{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.metric .v{font-family:var(--font-d);font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.metric .s{font-size:13px;color:var(--ink-3)}
.cmp{display:flex;flex-direction:column}
.cmp div{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;font-size:15px}
.cmp div+div{border-top:1px solid var(--line)}

/* presupuestos */
.bud{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 0;width:100%;text-align:left}
.bud+.bud{border-top:1px solid var(--line)}
.bud .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.bud .top b{font-weight:600}
.bud .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3);margin-top:5px}
.nob{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip .ic{width:16px;height:16px;color:var(--c,var(--ink-2))}

/* ajustes */
.set-list{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;font-size:15px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .ic{color:var(--ink-2)}
.set-row .grow{flex:1;display:flex;flex-direction:column}
.set-row small{color:var(--ink-3);font-size:13px}
.set-row.danger,.set-row.danger .ic{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;width:100%;outline:none}
.inp:focus{border-color:var(--brand);background:var(--surface)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 0 4px}
.about .mark{width:52px;height:52px;border-radius:15px}
.about b{font-family:var(--font-d);font-size:18px}

/* ---------- Barra inferior ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.tab[aria-current="page"]{color:var(--brand)}
.fab{justify-self:center;width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 40%,transparent);margin-top:-18px}
.fab .ic{width:26px;height:26px}
.fab:active{transform:scale(.95)}

/* ---------- Hoja inferior (formularios) ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,16,14,.5);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;
  max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{font-family:var(--font-d);font-size:19px;margin:0}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.x .ic{width:18px;height:18px}
.amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 0 8px}
.amt:focus-within{border-color:var(--brand)}
.amt span{font-family:var(--font-d);font-size:28px;color:var(--ink-3);font-weight:600}
.amt input{border:0;outline:none;background:none;font-family:var(--font-d);font-weight:700;font-size:38px;width:100%;min-width:0;letter-spacing:-.02em}
.err{color:var(--bad);font-size:13px;min-height:0}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;border:1.5px solid transparent;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.15}
.cbtn[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--ink)}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mrow .chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}
.mrow .chip[aria-pressed="true"] .ic{color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-acts{display:flex;gap:10px}
.sheet-acts .btn{flex:1;height:52px;font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);
  box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s ease;display:flex;gap:8px;align-items:center}
.toast .ic{width:18px;height:18px}
.dialog{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:61;max-width:400px;margin:0 auto;background:var(--surface);
  border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog h3{margin:0;font-family:var(--font-d);font-size:18px}
.dialog p{margin:0;color:var(--ink-2);font-size:15px}
.dialog .sheet-acts{margin-top:8px}
.dialog .sheet-acts .btn{height:46px}

.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main id="view"></main>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button class="tab" data-go="home"></button>
    <button class="tab" data-go="movs"></button>
    <button class="fab" data-act="add" aria-label="Agregar movimiento"></button>
    <button class="tab" data-go="stats"></button>

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2, '0');

const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();

/* ---------- Dinero ---------- */
function locale() { return (CURRENCIES.find(c => c[0] === S.currency) || CURRENCIES[0])[2]; }
function fmt(n, compact = false) {
  const dec = ZERO_DEC.has(S.currency) ? 0 : 2;
  try {
    return new Intl.NumberFormat(locale(), {style:'currency', currency:S.currency, currencyDisplay:'narrowSymbol',
      notation: compact ? 'compact' : 'standard', minimumFractionDigits: compact ? 0 : (Number.isInteger(n) && !dec ? 0 : dec),
      maximumFractionDigits: compact ? 1 : dec}).format(n);
  } catch (e) { return S.currency + ' ' + Number(n).toFixed(dec); }
}
function sym() {
  try { return new Intl.NumberFormat(locale(), {style:'currency', currency:S.currency, currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p => p.type === 'currency').value; }
  catch (e) { return '$'; }
}
const pct = x => Math.round(x * 100) + '%';
function parseAmount(str) {
  if (ZERO_DEC.has(S.currency)) return Number(String(str).replace(/\D/g, '')) || 0;
  let s = String(str).replace(/[^\d.,]/g, '');
  const last = Math.max(s.lastIndexOf('.'), s.lastIndexOf(','));
  if (last >= 0 && s.length - last - 1 <= 2) s = s.slice(0, last).replace(/[.,]/g, '') + '.' + s.slice(last + 1);
  else s = s.replace(/[.,]/g, '');
  return Math.round((parseFloat(s) || 0) * 100) / 100;
}
function amountToInput(n) {
  if (!n) return '';
  if (ZERO_DEC.has(S.currency)) return Math.round(n).toLocaleString('es-CO');
  return String(n).replace('.', ',');
}

/* ---------- Estado ---------- */
function defaults() { return {v:1, name:'', currency:'COP', theme:'auto', tx:[], budgets:{}, monthlyBudget:0, sample:false, hideInstall:false}; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaults(), JSON.parse(raw)); } catch (e) {}
  return Object.assign(defaults(), sampleData());
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar en este dispositivo. Revisa que Safari no esté en modo privado.', 'alert'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Datos de ejemplo: seis meses realistas, marcados como ejemplo */
function sampleData() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (a, b, step = 100) => Math.round((a + rnd() * (b - a)) / step) * step;
  const t = TODAY(), today = ymd(t), tx = [];
  const add = (y, m, d, type, amount, c, note, meth) => {
    d = Math.min(d, daysIn(y, m)); const date = `${y}-${pad(m + 1)}-${pad(d)}`;
    if (date <= today) tx.push({id:uid(), type, amount, cat:c, date, note, method:meth, sample:true});
  };
  for (let k = -5; k <= 0; k++) {
    const [y, m] = shiftM(t.getFullYear(), t.getMonth(), k); const D = daysIn(y, m);
    add(y, m, 1, 'ingreso', 4200000, 'salario', 'Nómina', 'transferencia');
    if (rnd() > .45) add(y, m, 14 + Math.floor(rnd() * 8), 'ingreso', between(500000, 1300000, 50000), 'freelance', pick(['Diseño de logo','Video para cliente','Asesoría','Sitio web']), 'transferencia');
    add(y, m, 3, 'gasto', 1300000, 'vivienda', 'Arriendo', 'transferencia');
    add(y, m, 8, 'gasto', between(110000, 165000), 'servicios', 'Energía', 'debito');
    add(y, m, 10, 'gasto', between(58000, 82000), 'servicios', 'Agua', 'debito');
    add(y, m, 12, 'gasto', 95000, 'servicios', 'Internet hogar', 'debito');
    add(y, m, 12, 'gasto', 55000, 'servicios', 'Plan celular', 'debito');
    add(y, m, 5, 'gasto', 38900, 'suscripciones', 'Streaming de series', 'credito');
    add(y, m, 5, 'gasto', 16900, 'suscripciones', 'Música', 'credito');
    add(y, m, 20, 'gasto', 350000, 'deudas', 'Cuota tarjeta de crédito', 'transferencia');
    add(y, m, 2, 'gasto', 200000, 'ahorro', 'Fondo de emergencia', 'transferencia');
    if (rnd() > .4) add(y, m, 6, 'gasto', 150000, 'educacion', 'Curso en línea', 'credito');
    const n = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    for (let i = n(4, 6); i--;) add(y, m, n(1, D), 'gasto', between(85000, 260000), 'mercado', pick(['Mercado semanal','Supermercado','Plaza de mercado','Tienda del barrio']), pick(['debito','debito','efectivo']));
    for (let i = n(5, 9); i--;) add(y, m, n(1, D), 'gasto', between(22000, 95000), 'restaurantes', pick(['Almuerzo','Cena con amigos','Café','Domicilio','Hamburguesas']), pick(['credito','debito','efectivo']));
    for (let i = n(8, 12); i--;) add(y, m, n(1, D), 'gasto', between(8000, 48000), 'transporte', pick(['Taxi','Gasolina','Bus','Parqueadero','App de transporte']), pick(['efectivo','debito','credito']));
    for (let i = n(0, 2); i--;) add(y, m, n(1, D), 'gasto', between(35000, 180000), 'salud', pick(['Farmacia','Consulta médica','Odontología']), 'debito');
    for (let i = n(1, 3); i--;) add(y, m, n(1, D), 'gasto', between(30000, 130000), 'ocio', pick(['Cine','Concierto','Salida fin de semana','Videojuego']), pick(['credito','debito']));
    for (let i = n(1, 2); i--;) add(y, m, n(1, D), 'gasto', between(60000, 340000), 'compras', pick(['Ropa','Zapatos','Artículos de hogar','Accesorios']), 'credito');
    if (rnd() > .5) add(y, m, n(1, D), 'gasto', between(40000, 120000), 'mascotas', pick(['Concentrado','Veterinario']), 'debito');
    if (rnd() > .6) add(y, m, n(1, D), 'gasto', between(50000, 150000), 'regalos', 'Cumpleaños', 'efectivo');

  }
  return {tx, monthlyBudget:4800000, sample:true,
    budgets:{mercado:900000, restaurantes:350000, transporte:350000, ocio:200000, compras:350000, servicios:420000}};
}

let S = load();
const now0 = TODAY();
const UI = {view:'home', y:now0.getFullYear(), m:now0.getMonth(), filter:'all', q:''};

/* ---------- Cálculos ---------- */
const monthTx = (y, m) => { const k = mkey(y, m); return S.tx.filter(t => t.date.startsWith(k)); };
const sums = list => list.reduce((a, t) => (a[t.type === 'ingreso' ? 'inc' : 'exp'] += t.amount, a), {inc:0, exp:0});
function byCat(list, type = 'gasto') {
  const map = {};
  for (const t of list) if (t.type === type) map[t.cat] = (map[t.cat] || 0) + t.amount;
  return Object.entries(map).map(([id, v]) => ({...cat(id), v})).sort((a, b) => b.v - a.v);
}
const isCurMonth = (y, m) => { const t = TODAY(); return y === t.getFullYear() && m === t.getMonth(); };
const isFuture = (y, m) => { const t = TODAY(); return y > t.getFullYear() || (y === t.getFullYear() && m > t.getMonth()); };
const elapsedDays = (y, m) => isCurMonth(y, m) ? TODAY().getDate() : (isFuture(y, m) ? 0 : daysIn(y, m));
const bstate = r => r >= 1 ? 'bad' : r >= .85 ? 'warn' : 'good';

function insights(y, m) {
  const list = monthTx(y, m), {inc, exp} = sums(list), cats = byCat(list), out = [];
  if (cats.length && exp > 0) out.push({tone:'info', icon:'pie', text:`<b>${esc(cats[0].name)}</b> es tu mayor gasto: ${pct(cats[0].v / exp)} de todo lo que gastaste este mes.`});
  const day = elapsedDays(y, m), [py, pm] = shiftM(y, m, -1);
  const prevExp = monthTx(py, pm).filter(t => t.type === 'gasto' && +t.date.slice(8) <= day).reduce((a, t) => a + t.amount, 0);
  if (prevExp > 0 && exp > 0) {
    const d = (exp - prevExp) / prevExp, when = isCurMonth(y, m) ? ' a esta misma fecha' : '';
    if (d >= .03) out.push({tone:'warn', icon:'up', text:`Llevas <b>${pct(d)} más</b> en gastos que el mes pasado${when}.`});
    else if (d <= -.03) out.push({tone:'good', icon:'down', text:`Llevas <b>${pct(-d)} menos</b> en gastos que el mes pasado${when}. Vas muy bien.`});
  }
  for (const [id, b] of Object.entries(S.budgets)) {
    const sp = (cats.find(c => c.id === id) || {v:0}).v;
    if (b > 0 && sp > b) out.push({tone:'bad', icon:'alert', text:`Superaste el presupuesto de <b>${esc(cat(id).name)}</b> por ${fmt(sp - b)}.`});
  }
  if (inc > 0) {
    const r = (inc - exp) / inc;
    out.push(r >= 0
      ? {tone: r >= .1 ? 'good' : 'warn', icon:'piggy', text:`Te queda el <b>${pct(r)}</b> de tus ingresos del mes (${fmt(inc - exp)}).`}
      : {tone:'bad', icon:'alert', text:`Este mes gastas <b>${fmt(exp - inc)}</b> más de lo que ingresas.`});
  }
  return out.slice(0, 4);
}

  const h = $('#hero');
  const titles = {movs:['Movimientos','Todo lo que entra y sale'], stats:['Análisis','Dónde se va tu dinero'], budget:['Presupuesto','Tus límites del mes'], settings:['Ajustes','Tu app, a tu manera']};
  if (UI.view === 'home') {
    const {inc, exp} = sums(monthTx(UI.y, UI.m)), bal = inc - exp;
    const hi = S.name ? `Hola, ${esc(S.name)}` : 'Hola';
    h.innerHTML = `<div class="hero-in">${brandBar()}
      <div class="hrow"><div><h1 class="htitle">${hi}</h1><p class="hsub">Resumen de ${MONTHS[UI.m]}</p></div>${monthSwitch()}</div>
      <div><div class="bal-label">Balance del mes</div><div class="bal num">${bal < 0 ? '−' : ''}${fmt(Math.abs(bal))}</div></div>
      <div class="split">
        <div><div class="k"><span class="dot-in">${ic('up')}</span>Ingresos</div><div class="v num">${fmt(inc)}</div></div>
        <div><div class="k"><span class="dot-out">${ic('down')}</span>Gastos</div><div class="v num">${fmt(exp)}</div></div>
      </div></div>`;
  } else {
    const [t, s] = titles[UI.view];
    h.innerHTML = `<div class="hero-in">${brandBar()}

  }
}

/* ---------- Vistas ---------- */
function txRow(t) {
  const c = cat(t.cat), mt = method(t.method), neg = t.type === 'gasto';
  const title = t.note || c.name;
  const sub = [t.note ? c.name : null, mt ? mt.name : null].filter(Boolean).join(' · ');
  return `<button class="tx" data-act="edit" data-id="${t.id}">
    <span class="cat-ic" style="--c:${c.color}">${ic(c.icon)}</span>
    <span class="tx-main"><span class="tx-title">${esc(title)}</span><span class="tx-sub">${esc(sub)}</span></span>
    <span class="tx-amt num ${neg ? '' : 'pos'}">${neg ? '−' : '+'}${fmt(t.amount)}</span></button>`;
}
function dayLabel(s) {
  const d = parseYmd(s), t = TODAY(), y = new Date(t); y.setDate(t.getDate() - 1);
  if (s === ymd(t)) return 'Hoy'; if (s === ymd(y)) return 'Ayer';
  return `${WDAYS[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
}
const sortTx = list => [...list].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
const emptyState = (icon, title, text, btn = true) => `<div class="empty">${ic(icon)}<h3>${title}</h3><p>${text}</p>${btn ? `<button class="btn btn-p" data-act="add">${ic('plus')}Agregar movimiento</button>` : ''}</div>`;

function vHome() {
  const list = monthTx(UI.y, UI.m), {exp} = sums(list), cats = byCat(list);
  let h = '';
  if (S.sample) h += `<div class="banner">${ic('sparkle')}<div><p><b>Estás viendo datos de ejemplo</b> para que conozcas la app. Cuando quieras, bórralos y empieza con tus propios gastos.</p>
    <div class="acts"><button class="btn btn-p btn-sm" data-act="clearSample">Empezar con mis datos</button></div></div></div>`;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone && !S.hideInstall) h += `<div class="banner">${ic('share')}<div><p><b>Instálala en tu iPhone:</b> toca el botón Compartir de Safari y elige “Agregar a pantalla de inicio”.</p>
    <div class="acts"><button class="btn btn-s btn-sm" data-act="hideInstall">Entendido</button></div></div></div>`;

  if (!list.length) return h + `<div class="card">${emptyState('cal', `Sin movimientos en ${MONTHS[UI.m]}`, 'Registra tu primer gasto o ingreso del mes. Toma menos de 10 segundos.')}</div>`;

  // Presupuesto
  if (S.monthlyBudget > 0) {
    const r = exp / S.monthlyBudget, st = bstate(r), left = S.monthlyBudget - exp;
    const dl = isCurMonth(UI.y, UI.m) ? daysIn(UI.y, UI.m) - TODAY().getDate() + 1 : 0;
    const label = {good:'En control', warn:'Cerca del límite', bad:'Excedido'}[st];
    h += `<section class="card"><div class="sec-h"><h2>Presupuesto del mes</h2><span class="pill ${st}">${label}</span></div>
      <div class="budget-top"><span class="big num">${fmt(exp)}</span><span class="muted small num">de ${fmt(S.monthlyBudget)}</span></div>
      <div class="bar ${st === 'good' ? '' : st}"><i style="width:${Math.min(r, 1) * 100}%"></i></div>
      <div class="budget-foot"><span class="num">${left >= 0 ? `Te quedan <b>${fmt(left)}</b>` : `Te pasaste por <b>${fmt(-left)}</b>`}</span>
      ${dl > 0 && left > 0 ? `<span class="num">${fmt(Math.floor(left / dl))} por día · ${dl} ${dl === 1 ? 'día' : 'días'}</span>` : ''}</div></section>`;
  } else {
    h += `<section class="card"><div class="sec-h"><h2>Presupuesto del mes</h2></div><p class="muted" style="margin:0 0 12px">Ponte un límite mensual y la app te avisa cuando te acerques.</p>
      <button class="btn btn-s btn-sm" data-act="editMonthly">${ic('target')}Definir presupuesto</button></section>`;
  }

  // Proyección e ideas
  const ins = insights(UI.y, UI.m);
  if (isCurMonth(UI.y, UI.m) && exp > 0) {
    const d = TODAY().getDate(), D = daysIn(UI.y, UI.m);
    const variable = list.filter(t => t.type === 'gasto' && !['vivienda','servicios','suscripciones','deudas','ahorro','educacion'].includes(t.cat)).reduce((a, t) => a + t.amount, 0);
    const proj = exp + (variable / d) * (D - d);
    if (d < D) ins.splice(1, 0, {tone:'info', icon:'trend', text:`A este ritmo cerrarás ${MONTHS[UI.m]} con unos <b>${fmt(Math.round(proj / 1000) * 1000 || proj)}</b> en gastos.`});
  }
  if (ins.length) h += `<section class="card"><div class="sec-h"><h2>Para tener en cuenta</h2></div><ul class="ins">${ins.slice(0, 4).map(i => `<li><span class="ib ${i.tone}">${ic(i.icon)}</span><span>${i.text}</span></li>`).join('')}</ul></section>`;

  // Top categorías
  if (cats.length) h += `<section class="card"><div class="sec-h"><h2>¿En qué gastas?</h2><button class="link" data-go="stats">Ver análisis</button></div>
    <div class="catrows">${cats.slice(0, 5).map(c => `<div class="catrow" style="--c:${c.color}"><span class="cat-ic">${ic(c.icon)}</span><div>
      <div class="top"><b>${esc(c.name)}</b><span class="num">${fmt(c.v)}</span></div>
      <div class="bar"><i style="width:${c.v / cats[0].v * 100}%"></i></div>
      <div class="meta"><span>${pct(c.v / exp)} del total</span>${S.budgets[c.id] ? `<span class="num">Límite ${fmt(S.budgets[c.id])}</span>` : ''}</div></div></div>`).join('')}</div></section>`;

  // Últimos
  h += `<section class="card"><div class="sec-h"><h2>Últimos movimientos</h2><button class="link" data-go="movs">Ver todos</button></div>
    <div class="txlist">${sortTx(list).slice(0, 6).map(txRow).join('')}</div></section>`;
  return h;
}

function vMovs() {
  return `<div class="search">${ic('search')}<input id="q" type="search" placeholder="Buscar por nota o categoría" value="${esc(UI.q)}" autocomplete="off" enterkeyhint="search"></div>
    <div class="seg" role="group" aria-label="Filtrar">
      ${[['all','Todos'],['gasto','Gastos'],['ingreso','Ingresos']].map(([k, l]) => `<button data-act="filter" data-f="${k}" aria-pressed="${UI.filter === k}">${l}</button>`).join('')}
    </div><div id="movList" class="movs-list"></div>`;
}
function renderMovList() {
  const el = $('#movList'); if (!el) return;
  const q = UI.q.trim().toLowerCase();
  let list = monthTx(UI.y, UI.m).filter(t => UI.filter === 'all' || t.type === UI.filter);
  if (q) list = list.filter(t => (t.note + ' ' + cat(t.cat).name + ' ' + (method(t.method)?.name || '')).toLowerCase().includes(q));
  if (!list.length) { el.innerHTML = `<div class="card">${q ? emptyState('search', 'Sin resultados', `No hay movimientos que coincidan con “${esc(UI.q)}”.`, false) : emptyState('list', `Sin movimientos en ${MONTHS[UI.m]}`, 'Toca el botón + para registrar el primero.')}</div>`; return; }
  const {inc, exp} = sums(list);
  const groups = {}; for (const t of sortTx(list)) (groups[t.date] ||= []).push(t);
  el.innerHTML = `<div class="totals-row"><span class="pill neutral num">${list.length} movimientos</span>${exp ? `<span class="pill bad num">Gastos ${fmt(exp)}</span>` : ''}${inc ? `<span class="pill good num">Ingresos ${fmt(inc)}</span>` : ''}</div>` +
    Object.entries(groups).map(([d, ts]) => {
      const de = ts.filter(t => t.type === 'gasto').reduce((a, t) => a + t.amount, 0);
      return `<div class="daywrap"><div class="dayh"><span>${dayLabel(d)}</span>${de ? `<span class="num">−${fmt(de)}</span>` : ''}</div><div class="daygrp">${ts.map(txRow).join('')}</div></div>`;
    }).join('');
}

function donutSvg(items, total) {
  const r = 60, C = 2 * Math.PI * r, gap = items.length > 1 ? 3 : 0; let off = 0;
  const segs = items.map(it => { const len = it.v / total * C; const s = `<circle r="${r}" cx="75" cy="75" fill="none" stroke="${it.color}" stroke-width="20" stroke-dasharray="${Math.max(len - gap, .5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off += len; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Gastos por categoría">${segs}
    <text x="75" y="74" text-anchor="middle" class="t1" font-size="${fmt(total, true).length > 8 ? 15 : 18}">${fmt(total, true)}</text>
    <text x="75" y="92" text-anchor="middle" class="t2">gastado</text></svg>`;
}
function barsSvg() {
  const months = []; for (let k = -5; k <= 0; k++) { const [y, m] = shiftM(UI.y, UI.m, k); months.push({y, m, ...sums(monthTx(y, m))}); }
  const raw = Math.max(1, ...months.map(o => Math.max(o.inc, o.exp)));
  const p = Math.pow(10, Math.floor(Math.log10(raw))), max = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(f => f * p).find(v => v >= raw);
  const W = 340, H = 180, L = 46, R = 6, T = 10, B = 150, gw = (W - L - R) / 6, bw = Math.min(14, gw / 3.2);
  const y = v => B - v / max * (B - T);
  let s = [0, .5, 1].map(f => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}"/><text class="tl" x="${L - 6}" y="${y(max * f) + 3}" text-anchor="end">${fmt(max * f, true)}</text>`).join('');
  months.forEach((o, i) => {
    const cx = L + gw * i + gw / 2, cur = i === 5;
    s += `<rect x="${cx - bw - 1.5}" y="${y(o.inc)}" width="${bw}" height="${B - y(o.inc)}" rx="3" fill="var(--good)" opacity="${cur ? 1 : .55}"/>`;
    s += `<rect x="${cx + 1.5}" y="${y(o.exp)}" width="${bw}" height="${B - y(o.exp)}" rx="3" fill="var(--bad)" opacity="${cur ? 1 : .55}"/>`;
    s += `<text class="ml ${cur ? 'cur' : ''}" x="${cx}" y="${B + 18}" text-anchor="middle">${MSHORT[o.m]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">${s}</svg>`;
}
function vStats() {
  const list = monthTx(UI.y, UI.m), {exp} = sums(list), cats = byCat(list);
  if (!list.length) return `<div class="card">${emptyState('pie', `Sin datos en ${MONTHS[UI.m]}`, 'Cuando registres movimientos verás aquí en qué se va tu dinero.')}</div>`;
  const [py, pm] = shiftM(UI.y, UI.m, -1), prevCats = byCat(monthTx(py, pm));
  let h = '';
  if (cats.length) {
    const top = cats.slice(0, 6), rest = cats.slice(6).reduce((a, c) => a + c.v, 0);
    const items = rest ? [...top, {name:'Resto', color:'#9AA8A4', v:rest}] : top;
    h += `<section class="card"><div class="sec-h"><h2>Gastos por categoría</h2></div><div class="donut-wrap">${donutSvg(items, exp)}
      <div class="legend">${items.map(c => `<div style="--c:${c.color}"><i></i><span>${esc(c.name)}</span><span class="num muted">${pct(c.v / exp)}</span></div>`).join('')}</div></div></section>`;
  }
  h += `<section class="card"><div class="sec-h"><h2>Últimos 6 meses</h2></div>${barsSvg()}
    <div class="lg"><span><i style="background:var(--good)"></i>Ingresos</span><span><i style="background:var(--bad)"></i>Gastos</span></div></section>`;

  const gastos = list.filter(t => t.type === 'gasto'), days = Math.max(1, elapsedDays(UI.y, UI.m));
  const biggest = gastos.reduce((a, t) => !a || t.amount > a.amount ? t : a, null);
  const wd = Array(7).fill(0); gastos.forEach(t => wd[parseYmd(t.date).getDay()] += t.amount);
  const wdMax = wd.indexOf(Math.max(...wd));
  const mt = {}; gastos.forEach(t => mt[t.method] = (mt[t.method] || 0) + t.amount);
  const mTop = Object.entries(mt).sort((a, b) => b[1] - a[1])[0];
  if (gastos.length) h += `<div class="metrics">
    <div class="metric"><span class="eyebrow">Promedio diario</span><span class="v num">${fmt(Math.round(exp / days))}</span><span class="s">en ${days} ${days === 1 ? 'día' : 'días'}</span></div>
    <div class="metric"><span class="eyebrow">Gasto más alto</span><span class="v num">${fmt(biggest.amount)}</span><span class="s">${esc(biggest.note || cat(biggest.cat).name)}</span></div>
    <div class="metric"><span class="eyebrow">Día que más gastas</span><span class="v">${cap1(WDAYS[wdMax])}</span><span class="s num">${fmt(wd[wdMax])} en total</span></div>
    <div class="metric"><span class="eyebrow">Medio de pago</span><span class="v">${mTop ? esc(method(mTop[0])?.name || 'Otro') : '—'}</span><span class="s">${mTop ? pct(mTop[1] / exp) + ' de tus gastos' : ''}</span></div></div>`;

  if (cats.length && prevCats.length) h += `<section class="card"><div class="sec-h"><h2>Frente a ${MONTHS[pm]}</h2></div><div class="cmp">${cats.slice(0, 8).map(c => {
    const pv = (prevCats.find(p => p.id === c.id) || {v:0}).v;
    let pill = '<span class="pill neutral">Nuevo</span>';
    if (pv) { const d = (c.v - pv) / pv; pill = Math.abs(d) < .02 ? '<span class="pill neutral">Igual</span>' : `<span class="pill ${d > 0 ? 'bad' : 'good'}">${d > 0 ? '+' : '−'}${pct(Math.abs(d))}</span>`; }
    return `<div><span>${esc(c.name)}</span><span class="num muted">${fmt(c.v)}</span>${pill}</div>`; }).join('')}</div>
    ${isCurMonth(UI.y, UI.m) ? `<p class="muted small" style="margin:8px 0 0">El mes actual aún está en curso; compara al cierre para una lectura completa.</p>` : ''}</section>`;
  return h;
}

function vBudget() {
  const list = monthTx(UI.y, UI.m), {exp} = sums(list), cats = byCat(list);
  const spent = id => (cats.find(c => c.id === id) || {v:0}).v;
  let h = '';
  const mb = S.monthlyBudget;
  if (mb > 0) {
    const r = exp / mb, st = bstate(r), left = mb - exp, cur = isCurMonth(UI.y, UI.m);
    const dl = cur ? daysIn(UI.y, UI.m) - TODAY().getDate() + 1 : 0;
    h += `<section class="card"><div class="sec-h"><h2>Límite mensual</h2><button class="link" data-act="editMonthly">Editar</button></div>
      <div class="budget-top"><span class="big num">${pct(r)}</span><span class="muted small num">${fmt(exp)} de ${fmt(mb)}</span></div>
      <div class="bar ${st === 'good' ? '' : st}"><i style="width:${Math.min(r, 1) * 100}%"></i></div>
      <div class="budget-foot"><span class="num">${left >= 0 ? `Disponible <b>${fmt(left)}</b>` : `Excedido por <b>${fmt(-left)}</b>`}</span>
      ${cur && left > 0 ? `<span class="num">Puedes gastar ${fmt(Math.floor(left / dl))} al día</span>` : ''}</div></section>`;
  } else {
    h += `<section class="card"><div class="sec-h"><h2>Límite mensual</h2></div><p class="muted" style="margin:0 0 12px">Define cuánto quieres gastar como máximo cada mes. Una buena guía: no más del 80% de tus ingresos.</p>
      <button class="btn btn-p btn-sm" data-act="editMonthly">${ic('target')}Definir límite mensual</button></section>`;
  }
  const withB = CATS.gasto.filter(c => S.budgets[c.id] > 0), without = CATS.gasto.filter(c => !(S.budgets[c.id] > 0));
  const sumB = withB.reduce((a, c) => a + S.budgets[c.id], 0);
  h += `<section class="card"><div class="sec-h"><h2>Por categoría</h2>${withB.length ? `<span class="muted small num">${fmt(sumB)} asignado</span>` : ''}</div>`;
  if (withB.length) h += `<div>${withB.map(c => {
    const b = S.budgets[c.id], s = spent(c.id), r = s / b, st = bstate(r);
    return `<button class="bud" data-act="editBudget" data-cat="${c.id}" style="--c:${c.color}"><span class="cat-ic">${ic(c.icon)}</span><div>
      <div class="top"><b>${esc(c.name)}</b><span class="pill ${st}">${st === 'bad' ? 'Excedido' : pct(r)}</span></div>
      <div class="bar ${st === 'good' ? '' : st}"><i style="width:${Math.min(r, 1) * 100}%;${st === 'good' ? 'background:var(--c)' : ''}"></i></div>
      <div class="meta num"><span>${fmt(s)} de ${fmt(b)}</span><span>${s <= b ? 'Quedan ' + fmt(b - s) : '+' + fmt(s - b)}</span></div></div></button>`; }).join('')}</div>`;
  else h += `<p class="muted" style="margin:0">Aún no tienes límites por categoría. Empieza por las que más te cuestan, como restaurantes o compras.</p>`;
  h += `</section>`;
  if (without.length) h += `<section class="card"><div class="sec-h"><h2>Agregar límite</h2></div><div class="nob">${without.map(c => `<button class="chip" data-act="editBudget" data-cat="${c.id}" style="--c:${c.color}">${ic(c.icon)}${esc(c.name)}${spent(c.id) ? ` <span class="muted num">· ${fmt(spent(c.id), true)}</span>` : ''}</button>`).join('')}</div></section>`;
  return h;
}

/* ---------- Render ---------- */
function render() {
  renderHero();
  const v = {home:vHome, movs:vMovs, stats:vStats, budget:vBudget, settings:vSettings}[UI.view]();
  const main = $('#view'); main.innerHTML = `<div class="view" style="display:flex;flex-direction:column;gap:16px">${v}</div>`;
  if (UI.view === 'movs') renderMovList();
  $$('.tab').forEach(b => b.toggleAttribute('aria-current', false));
  const cur = $(`.tab[data-go="${UI.view}"]`); if (cur) cur.setAttribute('aria-current', 'page');
}
function go(view) { UI.view = view; render(); window.scrollTo(0, 0); }
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = S.theme;
}

/* ---------- Hoja: movimiento ---------- */
let D = null;
function openSheet(html) {
  $('#sheetIn').innerHTML = `<div class="grab"></div>` + html;
  $('#scrim').hidden = false; $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
}
function closeSheet() { $('#scrim').hidden = true; $('#sheet').hidden = true; document.body.style.overflow = ''; D = null; }

function openTx(id) {
  const t = id && S.tx.find(x => x.id === id);
  const defDate = isCurMonth(UI.y, UI.m) ? ymd(TODAY()) : `${UI.y}-${pad(UI.m + 1)}-01`;
  D = t ? {...t} : {type:'gasto', amount:0, cat:'mercado', date:defDate, method:'debito', note:''};
  drawTx(!!t);
  if (!t) setTimeout(() => $('#f-amt')?.focus(), 250);
}
function drawTx(editing) {
  const cats = CATS[D.type];
  if (!cats.some(c => c.id === D.cat)) D.cat = cats[0].id;
  openSheet(`<div class="sheet-h"><h2>${editing ? 'Editar movimiento' : 'Nuevo movimiento'}</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="seg" role="group" aria-label="Tipo">${[['gasto','Gasto'],['ingreso','Ingreso']].map(([k, l]) => `<button data-act="ttype" data-t="${k}" aria-pressed="${D.type === k}">${l}</button>`).join('')}</div>
    <div><label for="f-amt" class="eyebrow">Monto</label><div class="amt"><span>${esc(sym())}</span><input id="f-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${amountToInput(D.amount)}"></div><div class="err" id="f-err"></div></div>
    <div><div class="eyebrow" style="margin-bottom:8px">Categoría</div><div class="cgrid">${cats.map(c => `<button class="cbtn" data-act="tcat" data-c="${c.id}" aria-pressed="${D.cat === c.id}" style="--c:${c.color}"><span class="cat-ic">${ic(c.icon)}</span>${esc(c.name)}</button>`).join('')}</div></div>
    <div class="field"><label for="f-note">Descripción</label><input class="inp" id="f-note" value="${esc(D.note)}" placeholder="${D.type === 'gasto' ? 'Ej.: almuerzo, gasolina, mercado' : 'Ej.: nómina, pago de cliente'}" maxlength="60" autocomplete="off" enterkeyhint="done"></div>
    <div class="field"><label for="f-date">Fecha</label><input class="inp" id="f-date" type="date" value="${D.date}"></div>
    <div class="field"><label>Medio de pago</label><div class="mrow">${METHODS.map(m => `<button class="chip" data-act="tmeth" data-m="${m.id}" aria-pressed="${D.method === m.id}">${ic(m.icon)}${m.name}</button>`).join('')}</div></div>
    <div class="sheet-acts">${editing ? `<button class="btn btn-d" data-act="delTx" style="flex:0 0 auto;width:56px" aria-label="Eliminar">${ic('trash')}</button>` : ''}
      <button class="btn btn-p" data-act="saveTx">${ic('check')}${editing ? 'Guardar cambios' : (D.type === 'gasto' ? 'Guardar gasto' : 'Guardar ingreso')}</button></div>`);
}
function readTx() {
  D.amount = parseAmount($('#f-amt').value); D.note = $('#f-note').value.trim(); D.date = $('#f-date').value || ymd(TODAY());
}
function saveTx() {
  readTx();
  if (!(D.amount > 0)) { $('#f-err').textContent = 'Escribe un monto mayor a cero.'; $('#f-amt').focus(); return; }
  const editing = S.tx.some(t => t.id === D.id);
  const rec = {id:D.id || uid(), type:D.type, amount:D.amount, cat:D.cat, date:D.date, note:D.note, method:D.method};
  if (editing) S.tx = S.tx.map(t => t.id === rec.id ? rec : t); else S.tx.push(rec);
  save();
  const d = parseYmd(rec.date); UI.y = d.getFullYear(); UI.m = d.getMonth();
  closeSheet(); render();
  // aviso de presupuesto
  const b = S.budgets[rec.cat];
  if (rec.type === 'gasto' && b > 0) {
    const s = byCat(monthTx(UI.y, UI.m)).find(c => c.id === rec.cat)?.v || 0;
    if (s > b) return toast(`Superaste el límite de ${cat(rec.cat).name} por ${fmt(s - b)}`, 'alert');
    if (s / b >= .85) return toast(`Llevas el ${pct(s / b)} del límite de ${cat(rec.cat).name}`, 'alert');
  }
  toast(editing ? 'Cambios guardados' : (rec.type === 'gasto' ? 'Gasto guardado' : 'Ingreso guardado'));
}

/* ---------- Hoja: presupuesto ---------- */
function openBudget(catId) {
  const isM = !catId, c = catId && cat(catId), val = isM ? S.monthlyBudget : (S.budgets[catId] || 0);
  const [py, pm] = shiftM(UI.y, UI.m, -1);
  const hint = isM ? sums(monthTx(py, pm)).exp : (byCat(monthTx(py, pm)).find(x => x.id === catId)?.v || 0);
  openSheet(`<div class="sheet-h"><h2>${isM ? 'Límite mensual' : 'Límite para ' + esc(c.name)}</h2><button class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
    <div><label for="b-amt" class="eyebrow">Monto máximo al mes</label><div class="amt"><span>${esc(sym())}</span><input id="b-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${amountToInput(val)}"></div>
    ${hint ? `<p class="muted small" style="margin:8px 0 0">En ${MONTHS[pm]} gastaste ${fmt(hint)}${isM ? ' en total' : ' en esta categoría'}.</p>` : ''}</div>
    <div class="sheet-acts">${val ? `<button class="btn btn-d" data-act="delBudget" data-cat="${catId || ''}">Quitar</button>` : ''}<button class="btn btn-p" data-act="saveBudget" data-cat="${catId || ''}">${ic('check')}Guardar</button></div>`);
  setTimeout(() => $('#b-amt')?.focus(), 250);
}
function setBudget(catId, v) {
  if (!catId) S.monthlyBudget = v; else if (v > 0) S.budgets[catId] = v; else delete S.budgets[catId];
  save(); closeSheet(); render(); toast(v > 0 ? 'Límite guardado' : 'Límite eliminado');
}

/* ---------- Diálogo y avisos ---------- */
function confirmBox({title, text, ok = 'Aceptar', danger = false}) {
  return new Promise(res => {
    const d = $('#dialog'), sc = $('#dscrim');
    d.innerHTML = `<h3>${title}</h3><p>${text}</p><div class="sheet-acts"><button class="btn btn-s" data-r="0">Cancelar</button><button class="btn ${danger ? 'btn-d' : 'btn-p'}" data-r="1">${ok}</button></div>`;
    d.hidden = false; sc.hidden = false;
    const done = v => { d.hidden = true; sc.hidden = true; d.onclick = sc.onclick = null; res(v); };
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); };
    sc.onclick = () => done(false);
    d.querySelector('[data-r="1"]').focus();
  });
}
let tt;
function toast(msg, icon = 'check') {
  const t = $('#toast'); t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800);
}

/* ---------- Exportar / importar ---------- */
async function shareFile(name, text, mime) {
  const blob = new Blob([text], {type:mime});
  try {
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportJson() { shareFile(`mis-gastos-copia-${ymd(TODAY())}.json`, JSON.stringify(S, null, 1), 'application/json'); }
function exportCsv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [['Fecha','Tipo','Categoría','Descripción','Medio de pago','Monto'].join(';')]
    .concat(sortTx(S.tx).map(t => [t.date, t.type === 'gasto' ? 'Gasto' : 'Ingreso', q(cat(t.cat).name), q(t.note || ''), method(t.method)?.name || '', String(t.type === 'gasto' ? -t.amount : t.amount).replace('.', ',')].join(';')));
  shareFile(`mis-gastos-${ymd(TODAY())}.csv`, '﻿' + rows.join('\n'), 'text/csv');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.tx)) throw new Error('formato');
    if (!await confirmBox({title:'¿Restaurar esta copia?', text:`Tiene ${data.tx.length} movimientos. Reemplazará los datos que tienes ahora.`, ok:'Restaurar'})) return;
    S = Object.assign(defaults(), data); save(); applyTheme(); render(); toast('Copia restaurada');
  } catch (err) { toast('Ese archivo no es una copia válida de Mis Gastos', 'alert'); }
});

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case 'prevM': case 'nextM': [UI.y, UI.m] = shiftM(UI.y, UI.m, a === 'prevM' ? -1 : 1); render(); break;
    case 'add': openTx(); break;
    case 'edit': openTx(b.dataset.id); break;
    case 'close': closeSheet(); break;
    case 'ttype': readTx(); D.type = b.dataset.t; D.cat = CATS[D.type][0].id; if (D.type === 'ingreso') D.method = 'transferencia'; drawTx(S.tx.some(t => t.id === D.id)); break;
    case 'tcat': D.cat = b.dataset.c; $$('.cbtn').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'tmeth': D.method = b.dataset.m; $$('.mrow .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'saveTx': saveTx(); break;
    case 'delTx': {
      const id = D.id;
      if (await confirmBox({title:'¿Eliminar este movimiento?', text:'Se quitará de tu historial.', ok:'Eliminar', danger:true})) {
        S.tx = S.tx.filter(t => t.id !== id); save(); closeSheet(); render(); toast('Movimiento eliminado', 'trash');
      }
      break;
    }
    case 'filter': UI.filter = b.dataset.f; $$('.seg [data-act="filter"]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderMovList(); break;
    case 'editMonthly': openBudget(''); break;
    case 'editBudget': openBudget(b.dataset.cat); break;
    case 'saveBudget': setBudget(b.dataset.cat, parseAmount($('#b-amt').value)); break;
    case 'delBudget': setBudget(b.dataset.cat, 0); break;
    case 'theme': S.theme = b.dataset.t; save(); applyTheme(); $$('[data-act="theme"]').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'hideInstall': S.hideInstall = true; save(); render(); break;
    case 'clearSample':
      if (await confirmBox({title:'¿Empezar con tus datos?', text:'Se borran los movimientos y límites de ejemplo. Lo que hayas agregado tú se conserva.', ok:'Empezar'})) {
        S.tx = S.tx.filter(t => !t.sample); S.budgets = {}; S.monthlyBudget = 0; S.sample = false; save(); render(); toast('Listo. Agrega tu primer movimiento con +');
      }
      break;
    case 'loadSample':
      if (await confirmBox({title:'¿Cargar datos de ejemplo?', text:'Se reemplazarán tus movimientos y límites actuales. Guarda una copia antes si los necesitas.', ok:'Cargar ejemplo', danger:true})) {
        Object.assign(S, sampleData()); save(); go('home'); toast('Datos de ejemplo cargados', 'sparkle');
      }
      break;
    case 'wipe':
      if (await confirmBox({title:'¿Borrar todos los datos?', text:'Se eliminan todos tus movimientos y límites de este teléfono. Esta acción no se puede deshacer.', ok:'Borrar todo', danger:true})) {
        const keep = {name:S.name, currency:S.currency, theme:S.theme, hideInstall:S.hideInstall};
        S = Object.assign(defaults(), keep); save(); go('home'); toast('Datos borrados', 'trash');
      }
      break;
    case 'exportJson': exportJson(); break;
    case 'exportCsv': exportCsv(); break;
    case 'import': $('#importFile').click(); break;
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { UI.q = t.value; renderMovList(); }
  if ((t.id === 'f-amt' || t.id === 'b-amt') && ZERO_DEC.has(S.currency)) {
    const n = t.value.replace(/\D/g, ''); t.value = n ? Number(n).toLocaleString('es-CO') : '';
    if ($('#f-err')) $('#f-err').textContent = '';
  }
  if (t.id === 's-name') { S.name = t.value.trim().slice(0, 30); save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 's-cur') { S.currency = e.target.value; save(); toast('Moneda actualizada'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'f-amt' || e.target.id === 'f-note')) { e.preventDefault(); saveTx(); }
  if (e.key === 'Enter' && e.target.id === 'b-amt') { e.preventDefault(); $('[data-act="saveBudget"]').click(); }
});

/* ---------- Inicio ---------- */
$('.tab[data-go="home"]').innerHTML = ic('home') + 'Inicio';
$('.tab[data-go="movs"]').innerHTML = ic('list') + 'Movimientos';
$('.tab[data-go="stats"]').innerHTML = ic('pie') + 'Análisis';
$('.tab[data-go="budget"]').innerHTML = ic('target') + 'Presupuesto';
$('.fab').innerHTML = ic('plus');
applyTheme(); render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
